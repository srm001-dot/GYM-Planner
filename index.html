<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Personal 6-day gym schedule and progress tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <title>IRON//TRACK — Gym Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#080a0f;--panel:#11151d;--panel2:#171c25;--line:#242b37;--text:#f4f6f8;--muted:#8d96a5;--accent:#a8ff3e;--accent2:#6ee7ff;--danger:#ff667d;--shadow:0 18px 45px #0008}
    *{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 80% -10%,#24310f 0,#080a0f 35%);color:var(--text);font-family:Inter,system-ui,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#0c0f15;border-right:1px solid var(--line);padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-weight:800;letter-spacing:.08em;font-size:18px;margin:4px 10px 30px}.brand span{color:var(--accent)}nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:13px 12px;text-align:left;border-radius:12px;margin:3px 0;font-weight:600}nav button.active,nav button:hover{background:var(--panel2);color:var(--text)}.content{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:30px}.top p{margin:6px 0;color:var(--muted)}.pill{background:#182118;border:1px solid #344d20;color:var(--accent);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(180deg,#121720,#0f131a);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:28px;font-weight:800;margin-top:8px}.section{margin-top:22px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section-title h2{font-size:18px;margin:0}.schedule{grid-template-columns:repeat(7,1fr)}.day{min-height:145px}.day .dow{color:var(--muted);font-size:12px}.day .date{font-size:20px;font-weight:800;margin:5px 0 12px}.day.workout{border-color:#334725}.day.workout .date{color:var(--accent)}.day.rest{opacity:.7}.day-name{font-weight:700}.mini{font-size:12px;color:var(--muted);line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#171c25;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:700}.btn.primary{background:var(--accent);color:#0a0d08;border-color:var(--accent)}.btn.small{padding:7px 9px;font-size:12px}.btn.danger{color:#ff9aaa;border-color:#4d2730}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,1fr)}.exercise-grid{grid-template-columns:repeat(3,1fr)}.exercise{overflow:hidden;padding:0}.exercise img{width:100%;height:180px;object-fit:cover;background:#1a2029;display:block}.exercise-body{padding:15px}.exercise h3{margin:0 0 5px;font-size:16px}.tag{display:inline-block;padding:5px 8px;border-radius:8px;background:#1a212c;color:var(--accent2);font-size:11px;font-weight:700;margin:3px 3px 3px 0}.muted{color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.field input,.field select{background:#0d1117;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px;outline:none}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-head{font-size:11px;color:var(--muted);text-align:center;padding:6px}.cal-day{min-height:92px;padding:9px;border:1px solid var(--line);border-radius:12px;background:#0f131a}.cal-day.today{outline:2px solid var(--accent)}.cal-day .num{font-weight:800}.cal-day .event{font-size:10px;color:var(--accent);margin-top:8px;line-height:1.3}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#10151d;border:1px solid var(--line);border-radius:20px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:transparent;color:var(--muted);border:0;font-size:24px}.toast{position:fixed;right:18px;bottom:18px;background:#e9ffd3;color:#0b1107;padding:12px 15px;border-radius:12px;font-weight:700;display:none;z-index:30}.toast.show{display:block}.mobile-nav{display:none}.hidden{display:none!important}.hero{padding:24px;border-radius:20px;background:linear-gradient(135deg,#182313,#11161e);border:1px solid #304520}.hero h2{font-size:26px;margin:0 0 7px}.hero p{color:#aeb6c2;margin:0}.progress{height:8px;background:#202630;border-radius:20px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:var(--accent);border-radius:20px}.quote{font-size:13px;color:#b5beca}.link{color:var(--accent2);text-decoration:none;font-size:12px}.note{background:#101720;border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;color:#b8c0ca;font-size:12px}
    @media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.schedule{grid-template-columns:repeat(4,1fr)}.exercise-grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{display:none}.content{margin:0;width:100%;padding:18px 14px 88px}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;background:#0c0f15;border-top:1px solid var(--line);z-index:10;padding:7px;justify-content:space-around}.mobile-nav button{background:transparent;border:0;color:var(--muted);font-size:11px;padding:6px}.mobile-nav button.active{color:var(--accent)}}
    @media(max-width:600px){.top h1{font-size:24px}.stats,.three,.formgrid,.exercise-grid{grid-template-columns:1fr}.schedule{grid-template-columns:repeat(2,1fr)}.calendar{gap:4px}.cal-day{min-height:70px;padding:6px}.cal-day .event{font-size:9px}.exercise img{height:150px}.card{padding:14px}.top{align-items:flex-start}}
  </style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">IRON<span>//</span>TRACK</div>
  <nav id="nav"></nav>
</aside>
<main class="content">
  <div class="top"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Your gym, your numbers, your progress.</p></div><span class="pill">81.6 KG</span></div>
  <div id="view"></div>
</main>
<div class="mobile-nav" id="mobileNav"></div>
</div>

<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const PLAN={
Monday:{focus:"Chest + Triceps", exercises:[
["Barbell Bench Press","Chest","4 × 8–12"],["Incline Dumbbell Press","Chest","3 × 10–12"],["Chest Press Machine","Chest","3 × 10–12"],["Pec Deck Fly","Chest","3 × 12–15"],["Cable Crossover","Chest","3 × 12–15"],["Cable Tricep Pushdown","Triceps","3 × 10–12"],["Overhead Cable Tricep Extension","Triceps","3 × 10–12"],["Assisted Dip Machine","Triceps","3 × 8–12"]]},
Tuesday:{focus:"Back + Biceps", exercises:[
["Lat Pulldown","Back","4 × 8–12"],["Seated Cable Row","Back","3 × 10–12"],["One-Arm Dumbbell Row","Back","3 × 10–12"],["Chest-Supported Row Machine","Back","3 × 10–12"],["Face Pull","Back","3 × 12–15"],["Barbell Curl","Biceps","3 × 10–12"],["Incline Dumbbell Curl","Biceps","3 × 10–12"],["Hammer Curl","Biceps","3 × 10–12"],["Plank","Core","3 × 45–60 sec"],["Leg Raises","Core","3 × 12–15"]]},
Wednesday:{focus:"Legs", exercises:[
["Barbell Squat","Quads","4 × 8–12"],["Leg Press","Quads","3 × 10–12"],["Walking Lunges","Quads","3 × 10–12 each"],["Leg Curl Machine","Hamstrings","3 × 10–15"],["Leg Extension","Quads","3 × 10–15"],["Romanian Deadlift","Hamstrings","3 × 8–12"],["Standing Calf Raise","Calves","4 × 12–15"],["Seated Calf Raise","Calves","3 × 12–15"]]},
Thursday:{focus:"Shoulders + Abs", exercises:[
["Machine Shoulder Press","Shoulders","4 × 8–12"],["Dumbbell Shoulder Press","Shoulders","3 × 10–12"],["Machine Lateral Raise","Shoulders","3 × 12–15"],["Cable Lateral Raise","Shoulders","3 × 12–15"],["Rear Delt Fly Machine","Shoulders","3 × 12–15"],["Face Pull","Shoulders","3 × 12–15"],["Dumbbell/Cable Shrugs","Traps","3 × 12–15"],["Cable Crunch","Abs","3 × 12–15"],["Hanging/Supported Leg Raise","Abs","3 × 12–15"],["Bicycle Crunch","Abs","3 × 20"],["Plank","Abs","3 × 45–60 sec"]]},
Friday:{focus:"Chest + Back • Variations", exercises:[
["Incline Chest Press Machine","Chest","3 × 10–12"],["Decline Chest Press Machine","Chest","3 × 10–12"],["Flat Dumbbell Press","Chest","3 × 10–12"],["Cable Low-to-High Fly","Chest","3 × 12–15"],["Single-Arm Cable Chest Press","Chest","3 × 10–12"],["Assisted Pull-Up Machine","Back","3 × 8–12"],["Close-Grip Lat Pulldown","Back","3 × 10–12"],["T-Bar Row / T-Bar Machine","Back","3 × 8–12"],["Single-Arm Cable Row","Back","3 × 10–12"],["Straight-Arm Pulldown","Back","3 × 12–15"]]},
Saturday:{focus:"Legs + Arms • Variations", exercises:[
["Hack Squat Machine","Quads","3 × 8–12"],["Bulgarian Split Squat","Quads","3 × 10 each"],["Smith Machine Squat","Quads","3 × 10–12"],["Seated Leg Curl","Hamstrings","3 × 10–15"],["Hip Thrust Machine","Glutes","3 × 10–12"],["Leg Extension","Quads","2 × 12–15"],["Seated Calf Raise","Calves","4 × 12–15"],["Preacher Curl Machine","Biceps","3 × 10–12"],["Cable Curl","Biceps","3 × 12–15"],["Rope Tricep Pushdown","Triceps","3 × 12–15"],["Cable Overhead Extension","Triceps","3 × 10–12"]]},
Sunday:{focus:"Rest / Recovery",exercises:[]}
};
const navItems=[["dashboard","⌂","Dashboard"],["workout","⚡","Workout"],["exercises","▦","Exercises"],["calendar","□","Calendar"],["progress","↗","Progress"],["settings","⚙","Settings"]];
let state=JSON.parse(localStorage.getItem("irontrack")||"null")||{weight:[{date:new Date().toISOString().slice(0,10),kg:81.6}],sessions:[],gymLogs:[],notes:[]};
let current="dashboard", chart;
function save(){localStorage.setItem("irontrack",JSON.stringify(state))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function today(){return new Date().toISOString().slice(0,10)}
function dayName(d=today()){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long"})}
function nav(){document.getElementById("nav").innerHTML=navItems.map(n=>`<button class="${current===n[0]?"active":""}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join("");document.getElementById("mobileNav").innerHTML=navItems.slice(0,5).map(n=>`<button class="${current===n[0]?"active":""}" onclick="go('${n[0]}')">${n[1]}<br>${n[2]}</button>`).join("")}
function go(v){current=v;render()}
function render(){nav();const titles={dashboard:["Dashboard","Your gym, your numbers, your progress."],workout:["Workout","Open today's plan and log your sets."],exercises:["Exercise Library","Your full 6-day exercise reference."],calendar:["Calendar","Training days and gym attendance."],progress:["Progress","Weight trend, gym time and consistency."],settings:["Settings","Backup your local data and personalize the app."]};document.getElementById("pageTitle").textContent=titles[current][0];document.getElementById("pageSub").textContent=titles[current][1];({dashboard:dashboard,workout:workout,exercises:exercises,calendar:calendar,progress:progress,settings:settings}[current])()}
function dashboard(){
 const latest=state.weight[state.weight.length-1]?.kg??81.6, first=state.weight[0]?.kg??latest, diff=(latest-first).toFixed(1);
 const completed=state.sessions.length, hours=state.gymLogs.reduce((a,x)=>a+(x.minutes||0),0);
 document.getElementById("view").innerHTML=`
 <div class="hero"><h2>6-day grind. One goal.</h2><p>Today is <b>${dayName()}</b> — ${PLAN[dayName()].focus}.</p><div class="progress"><span style="width:${Math.min(100,(completed/30)*100)}%"></span></div><p class="quote" style="margin-top:10px">${completed} workout${completed===1?"":"s"} logged • Keep showing up.</p></div>
 <div class="grid stats section"><div class="card stat"><div class="label">CURRENT WEIGHT</div><div class="value">${latest} kg</div><div class="muted">Change ${diff>0?"+":""}${diff} kg</div></div><div class="card stat"><div class="label">WORKOUTS LOGGED</div><div class="value">${completed}</div><div class="muted">This device</div></div><div class="card stat"><div class="label">GYM TIME</div><div class="value">${Math.floor(hours/60)}h ${hours%60}m</div><div class="muted">All logged sessions</div></div><div class="card stat"><div class="label">TODAY</div><div class="value">${dayName().slice(0,3)}</div><div class="muted">${PLAN[dayName()].focus}</div></div></div>
 <div class="section"><div class="section-title"><h2>Today's plan</h2><button class="btn primary" onclick="go('workout')">Start workout</button></div><div class="card"><div class="grid three">${PLAN[dayName()].exercises.slice(0,6).map(e=>`<div><b>${e[0]}</b><div class="mini">${e[1]} • ${e[2]}</div></div>`).join("")}</div></div></div>
 <div class="section"><div class="section-title"><h2>Quick gym timer</h2><button class="btn" onclick="openGymLog()">Log entry / exit</button></div><div class="card note">Your gym attendance is stored locally on this device. You can export it anytime from Settings.</div></div>`;
}
function workout(){
 const d=dayName(), p=PLAN[d]; if(d==="Sunday"){document.getElementById("view").innerHTML=`<div class="hero"><h2>Recovery day 😴</h2><p>Walk, stretch, hydrate and recover. Your next training day is Monday.</p></div>`;return}
 document.getElementById("view").innerHTML=`<div class="section"><div class="actions"><button class="btn primary" onclick="logWorkout()">✓ Mark workout complete</button><button class="btn" onclick="openGymLog()">⏱ Log gym time</button></div></div><div class="grid exercise-grid section">${p.exercises.map((e,i)=>exerciseCard(e,i,d)).join("")}</div>`;
}
function exerciseCard(e,i,d){const q=encodeURIComponent(e[0]+" exercise");const img=`https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(e[0].replaceAll(" ","_"))}.jpg`;return `<div class="card exercise"><img loading="lazy" src="${img}" onerror="this.src='https://source.unsplash.com/800x500/?${q}'" alt="${e[0]}"><div class="exercise-body"><h3>${e[0]}</h3><span class="tag">${e[1]}</span><span class="tag">${e[2]}</span><div style="margin-top:10px"><a class="link" target="_blank" rel="noopener" href="https://commons.wikimedia.org/w/index.php?search=${q}&title=Special:MediaSearch&type=image">Find reference photo ↗</a></div></div></div>`}
function exercises(){
 const all=Object.entries(PLAN).filter(([d])=>d!=="Sunday").flatMap(([d,p])=>p.exercises.map(e=>[...e,d]));
 document.getElementById("view").innerHTML=`<div class="card"><div class="formgrid"><div class="field"><label>Search</label><input id="exSearch" oninput="filterExercises()" placeholder="Bench, pulldown, squat..."></div><div class="field"><label>Day</label><select id="exDay" onchange="filterExercises()"><option>All</option>${Object.keys(PLAN).filter(x=>x!=="Sunday").map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Muscle</label><select id="exMuscle" onchange="filterExercises()"><option>All</option>${[...new Set(all.map(x=>x[1]))].sort().map(x=>`<option>${x}</option>`).join("")}</select></div></div></div><div id="exList" class="grid exercise-grid section"></div>`;filterExercises()}
function filterExercises(){const all=Object.entries(PLAN).filter(([d])=>d!=="Sunday").flatMap(([d,p])=>p.exercises.map(e=>[...e,d]));const s=(document.getElementById("exSearch")?.value||"").toLowerCase(),d=document.getElementById("exDay")?.value||"All",m=document.getElementById("exMuscle")?.value||"All";document.getElementById("exList").innerHTML=all.filter(e=>(d==="All"||e[3]===d)&&(m==="All"||e[1]===m)&&e[0].toLowerCase().includes(s)).map((e,i)=>exerciseCard(e,i,e[3])).join("")}
function calendar(){
 const now=new Date(), y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="cal-head">${x}</div>`).join("");for(let i=0;i<first;i++)h+="<div></div>";for(let n=1;n<=days;n++){const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,dn=dayName(ds),p=PLAN[dn];const logged=state.sessions.some(x=>x.date===ds),g=state.gymLogs.find(x=>x.date===ds);h+=`<div class="cal-day ${ds===today()?"today":""}"><div class="num">${n}</div><div class="event">${p?`🏋 ${p.focus}`:"😴 Rest"}${logged?"<br>✓ Done":""}${g?`<br>⏱ ${fmt(g.minutes)}`:""}</div></div>`}document.getElementById("view").innerHTML=`<div class="section-title"><h2>${now.toLocaleString("en-US",{month:"long",year:"numeric"})}</h2><button class="btn" onclick="openGymLog()">+ Gym attendance</button></div><div class="card"><div class="calendar">${h}</div></div>`}
function progress(){
 document.getElementById("view").innerHTML=`<div class="grid two"><div class="card"><div class="section-title"><h2>Weight trend</h2><button class="btn small primary" onclick="openWeight()">+ Add weight</button></div><canvas id="weightChart" height="230"></canvas></div><div class="card"><h2>Weekly snapshot</h2><div class="grid three"><div><div class="muted">Sessions</div><b>${state.sessions.length}</b></div><div><div class="muted">Gym hours</div><b>${(state.gymLogs.reduce((a,x)=>a+x.minutes,0)/60).toFixed(1)}</b></div><div><div class="muted">Entries</div><b>${state.weight.length}</b></div></div><div class="note" style="margin-top:18px">Tip: add your weight on the same day each week for a cleaner trend.</div></div></div><div class="section"><div class="card"><h2>Weight history</h2><table class="table"><thead><tr><th>Date</th><th>Weight</th></tr></thead><tbody>${state.weight.slice().reverse().map(w=>`<tr><td>${w.date}</td><td>${w.kg} kg</td></tr>`).join("")||"<tr><td colspan=2>No entries</td></tr>"}</tbody></table></div></div>`;
 setTimeout(()=>{if(chart)chart.destroy();chart=new Chart(document.getElementById("weightChart"),{type:"line",data:{labels:state.weight.map(x=>x.date),datasets:[{label:"kg",data:state.weight.map(x=>x.kg),tension:.35,fill:false,borderColor:"#a8ff3e",backgroundColor:"#a8ff3e"}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8d96a5"}},y:{ticks:{color:"#8d96a5"},grid:{color:"#242b37"}}}}})},0)}
function settings(){document.getElementById("view").innerHTML=`<div class="grid two"><div class="card"><h2>Data</h2><p class="muted">Everything is stored in your browser. No account or backend is required.</p><div class="actions"><button class="btn primary" onclick="exportData()">Export backup</button><label class="btn">Import backup<input type="file" accept="application/json" hidden onchange="importData(event)"></label><button class="btn danger" onclick="resetData()">Reset all data</button></div></div><div class="card"><h2>App</h2><p class="muted">Install this site from your browser's “Add to Home Screen” option after deploying it as a PWA.</p><div class="note">Exercise reference images use Wikimedia Commons search/redirects where available, with a fallback reference search link. Check the source license before redistributing any image outside the app.</div></div></div>`}
function logWorkout(){const d=today();if(!state.sessions.some(x=>x.date===d)){state.sessions.push({date:d,day:dayName()});save();toast("Workout marked complete ✓")}else toast("Already logged today");render()}
function openWeight(){openModal("Add weekly weight",`<div class="formgrid"><div class="field"><label>Date</label><input id="wDate" type="date" value="${today()}"></div><div class="field"><label>Weight (kg)</label><input id="wKg" type="number" step=".1" value="${state.weight.at(-1)?.kg||81.6}"></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="addWeight()">Save weight</button></div>`)}
function addWeight(){const date=document.getElementById("wDate").value,kg=Number(document.getElementById("wKg").value);if(!date||!kg)return;state.weight=state.weight.filter(x=>x.date!==date);state.weight.push({date,kg});state.weight.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();toast("Weight saved");render()}
function openGymLog(){openModal("Gym attendance",`<div class="formgrid"><div class="field"><label>Date</label><input id="gDate" type="date" value="${today()}"></div><div class="field"><label>Entry</label><input id="gIn" type="time"></div><div class="field"><label>Exit</label><input id="gOut" type="time"></div></div><div class="note" style="margin-top:12px">The app calculates total time automatically, including sessions that pass midnight.</div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="addGym()">Calculate & save</button></div>`)}
function addGym(){const date=document.getElementById("gDate").value,inn=document.getElementById("gIn").value,out=document.getElementById("gOut").value;if(!date||!inn||!out){toast("Enter all three fields");return}let [h1,m1]=inn.split(":").map(Number),[h2,m2]=out.split(":").map(Number);let a=h1*60+m1,b=h2*60+m2;if(b<a)b+=1440;state.gymLogs=state.gymLogs.filter(x=>x.date!==date);state.gymLogs.push({date,entry:inn,exit:out,minutes:b-a});state.gymLogs.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();toast(`Gym time: ${fmt(b-a)}`);render()}
function fmt(m){return `${Math.floor(m/60)}h ${m%60}m`}
function openModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`irontrack-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();toast("Backup imported");render()}catch{toast("Invalid backup file")}};r.readAsText(f)}
function resetData(){if(confirm("Delete all workouts, attendance and weight history?")){localStorage.removeItem("irontrack");location.reload()}}
render();
</script>
</body>
</html>
